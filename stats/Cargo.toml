[package]
name = "stats"
version = "0.1.0"
edition = "2024"

[profile.release]
debug = 1

[features]
dhat-heap = [] # if you are doing heap profiling

[dependencies]
human_bytes = "0.4.3"
rand = "0.10.1"
zstd = "0.13.3"
poro_hash = { path = "../hash" }
sysinfo = "0.39.5"
clap = { version = "4.6.1", features = ["derive"] }
anyhow = "1.0.103"

memmap2 = "0.9.11"
lru = "0.18.0"
dhat = "0.3.3"
